---
# This is a workflow to generate the zip file and metadata.json for KiCAD PCM
# https://gitlab.com/kicad/addons/metadata/-/merge_requests/14

name: KiCAD PCM packaging
on:  # yamllint disable-line rule:truthy
  release:
    branches: [main]
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to package (YYYY.MM.DD)"
        required: true
        type: string

jobs:
  create_archive:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
          fetch-depth: 0

      - name: Validate release version and tag
        run: |
          python3 -c 'from datetime import datetime; import os; datetime.strptime(os.environ["VERSION"], "%Y.%m.%d")'
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION"
          test "$(git tag --points-at HEAD --list "$VERSION")" = "$VERSION"

      - name: Create archive
        run: sh ./PCM/create_pcm_archive.sh "$VERSION"

      - name: Upload zip as asset to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./PCM/KiCAD-PCM-${{ env.VERSION }}.zip
          asset_name: KiCAD-PCM-${{ env.VERSION }}.zip
          overwrite: true
          tag: ${{ env.VERSION }}

      - name: Trigger custom kicad repo rebuild
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Rebuild repository
          ref: refs/heads/main
          repo: NikolayMurha/kicad-repository
          token: ${{ secrets.PERSONAL_TOKEN }}
          inputs: '{ "VERSION": "${{env.VERSION}}", "DOWNLOAD_SHA256": "${{env.DOWNLOAD_SHA256}}", "DOWNLOAD_SIZE": "${{env.DOWNLOAD_SIZE}}", "DOWNLOAD_URL": "${{env.DOWNLOAD_URL}}", "INSTALL_SIZE": "${{env.INSTALL_SIZE}}" }'
